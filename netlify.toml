[build]
  command = "node --check netlify/functions/marketing-bottleneck.mjs"
  publish = "quiz-site"
  functions = "netlify/functions"

# Temporary secure destination while the custom-domain certificate is repaired.
[[redirects]]
  from = "http://bottleneck.clevercalic.co/*"
  to = "https://marketing-mayhem-meter.netlify.app/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
